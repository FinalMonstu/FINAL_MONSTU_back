# java -jar -Dspring.profiles.active=prod monstu-server.jar
-Dspring.profiles.active=prod

# MySQL : 8.3 Setting
spring.datasource.url=${mysql.rds.url}
spring.datasource.username=${mysql.rds.username}
spring.datasource.password=${mysql.rds.password}

# Redis Setting
spring.data.redis.host=${redis.host}

# 2. JPA Setting
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 3. Logging Level
logging.level.root=INFO


